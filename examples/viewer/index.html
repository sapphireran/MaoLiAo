<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>MaoLiAo reference maps</title>
  <style>
    body { font-family: Georgia, serif; margin: 24px; background: #0f1a24; color: #e0e6ed; }
    a { color: #00bbf9; }
    h1 { font-size: 1.4rem; }
    .row { margin: 20px 0; overflow-x: auto; background: #1b2838; padding: 12px; }
    object { width: 100%; min-height: 180px; }
    p { max-width: 70ch; line-height: 1.45; }
  </style>
</head>
<body>
  <h1>猫里奥 — personal map dump</h1>
  <p>
    SVG plans written by <code>examples/tools/dump_worlds.py</code>.
    World 2 is the runtime map: the goal sign and trees sit past
    <code>MAP_NUMBER</code> and never load in V2.0.
  </p>
  <div class="row"><h2>World 1</h2><object data="../out/world1.svg" type="image/svg+xml"></object></div>
  <div class="row"><h2>World 2 (capped)</h2><object data="../out/world2.svg" type="image/svg+xml"></object></div>
  <div class="row"><h2>World 3 (seed 2020)</h2><object data="../out/world3.svg" type="image/svg+xml"></object></div>
  <div class="row"><h2>Jump arc</h2><object data="../out/jump_arc.svg" type="image/svg+xml"></object></div>
</body>
</html>
